name: tag-on-version

# When a release promotion lands on main, read the VERSION file. If the
# matching release tag does not exist yet, create it and dispatch the
# release workflow for it. If the tag already exists (an ordinary merge
# that did not bump VERSION), do nothing and succeed.
#
# Why the dispatch step exists: a tag pushed with the default
# GITHUB_TOKEN does not trigger other workflows (GitHub's recursion
# guard), so creating the tag alone would silently never release.
# workflow_dispatch is exempt from that guard, so this workflow
# dispatches release.yml explicitly for the new tag. The dispatch call
# is also why this workflow needs actions: write on top of
# contents: write (which is what creates the tag).

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Create release tag from VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read VERSION
        id: version
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::No VERSION file on main. A merge to main is a release promotion and must carry a VERSION file (one plain version number, e.g. 1.1.1, no 'v' prefix)."
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION does not contain a plain version number (found: '${VERSION}'). Expected e.g. 1.1.1 with no 'v' prefix."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"     >> $GITHUB_OUTPUT
          echo "VERSION is ${VERSION} (release tag v${VERSION})."

      - name: Check whether the tag already exists
        id: tagcheck
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${TAG} already exists - this merge did not bump VERSION, so there is nothing to release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${TAG} does not exist yet - creating it and dispatching the release workflow."
          fi

      - name: Create the release tag
        if: steps.tagcheck.outputs.exists == 'false'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });
            core.info(`Created ${tag} at ${context.sha}`);

      - name: Dispatch the release workflow
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref "${TAG}" -f tag="${TAG}"
